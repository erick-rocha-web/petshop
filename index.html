<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      PRÉVIA COMERCIAL: instruída a não ser indexada enquanto a Animalandia não
      aprovar e autorizar a publicação. Isso orienta mecanismos de busca; não é
      controle de acesso.

      Para publicar em definitivo (só depois da autorização), veja "Publicação
      definitiva" no README: remover a meta `robots` abaixo, liberar o
      `public/robots.txt`, preencher `og:url` com o domínio real e publicar uma
      imagem de compartilhamento.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Animalandia Pet Shop — Prévia de site</title>
    <meta
      name="description"
      content="Prévia de site para a Animalandia Pet Shop: banho e tosa, rações, brinquedos, acessórios e medicamentos no Setor Garavelo, Aparecida de Goiânia — GO. Contato pelo WhatsApp."
    />
    <meta name="theme-color" content="#15586b" />
    <meta name="color-scheme" content="light" />

    <!--
      Textos de compartilhamento. Sem `og:url` e sem `og:image`: não existe
      domínio publicado nem imagem oficial da loja, e não inventamos nenhum dos
      dois. O título se identifica como prévia em qualquer lugar onde o link for
      colado.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Animalandia Pet Shop" />
    <meta property="og:title" content="Animalandia Pet Shop — Prévia de site" />
    <meta
      property="og:description"
      content="Prévia de site: banho e tosa, rações, brinquedos e acessórios no Setor Garavelo, Aparecida de Goiânia — GO. Consulte os horários e a disponibilidade pelo WhatsApp."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
